name: Verify scene-led opening
on:
  pull_request:
    paths:
      - 'sceneplay/**'
      - 'tools/sceneplay/**'
      - 'tools/rebuild/build_preview.py'
      - '.github/workflows/sceneplay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sceneplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      SCENEPLAY_URL: http://127.0.0.1:8093/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the committed offline runtime matches its source
        run: |
          npm install --prefix "$RUNNER_TEMP/sceneplay-tools" --no-audit --no-fund esbuild@0.25.12
          ESBUILD_PATH="$RUNNER_TEMP/sceneplay-tools/node_modules/esbuild" node tools/sceneplay/bundle.mjs "$RUNNER_TEMP/compiled-game.js"
          cmp sceneplay/game.js "$RUNNER_TEMP/compiled-game.js"
      - run: node tools/sceneplay/test_logic.mjs && node tools/sceneplay/test_media.mjs
      - run: node tools/sceneplay/test_motion.mjs && node tools/sceneplay/test_story_continuity.mjs
      - run: python3 tools/sceneplay/build.py --output "$RUNNER_TEMP/sceneplay-build"
      - name: Test actual rendered gameplay and offline delivery
        run: |
          python3 -m http.server 8093 --bind 127.0.0.1 --directory "$RUNNER_TEMP/sceneplay-build" > "$RUNNER_TEMP/sceneplay-server.log" 2>&1 &
          node tools/sceneplay/test_browser.cjs
          node tools/sceneplay/test_touch.cjs
          node tools/sceneplay/test_polish.cjs
          node tools/sceneplay/test_delivery.cjs
