name: Verify static archive
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test && npm run audit:assets && npm run build
      - run: npm run test:browser && npm run test:production
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
