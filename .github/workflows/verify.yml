name: Verify static archive
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: npm test && npm run audit:assets && npm run build
      - run: npm run test:browser && npm run test:production
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: python3 tools/package_playable.py --zip /tmp/THE_LAST_ARCHIVE_PLAYABLE.zip
      - uses: actions/upload-artifact@v4
        if: github.head_ref != 'codex/casework-rebuild'
        with:
          name: THE_LAST_ARCHIVE_PLAYABLE
          path: .playable/
          include-hidden-files: true
          retention-days: 3
