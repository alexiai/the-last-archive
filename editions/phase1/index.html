<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#121414" />
    <meta
      name="description"
      content="A recovered phone. Nine chapters. An investigation into the life someone left behind."
    />
    <title>The Last Archive — An investigation</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="art-direction.css" />
    <link rel="stylesheet" href="production.css" />
  </head>
  <body>
    <header id="masthead">
      <a
        class="wordmark"
        href="#"
        onclick="
          S.unlocked ? home() : lock();
          return false;
        "
        ><span class="archive-mark"></span> THE LAST ARCHIVE</a
      ><span class="edition">VESPERA / DIGITAL INVESTIGATIONS</span
      ><button
        class="text-btn"
        onclick="help()"
        aria-label="How to investigate"
      >
        Field guide
      </button>
    </header>
    <main id="stage">
      <nav id="rail" aria-label="Investigation tools">
        <div class="eyebrow">CASE WORKSPACE</div>
        <button onclick="home()" data-nav="home">Device <span>01</span></button
        ><button onclick="board()" data-nav="board">
          Evidence board <span id="evcount">00</span></button
        ><button onclick="caseTimeline()" data-nav="timeline">
          Timeline <span>↗</span></button
        ><button onclick="profiles()" data-nav="profiles">
          Subjects <span>↗</span></button
        ><button onclick="chapters()" data-nav="chapters">
          Chapters <span>09</span>
        </button>
        <div class="rail-foot">
          <span class="live-dot"></span> LOCAL ARCHIVE<br /><small
            >Progress stored on this device</small
          >
        </div>
      </nav>
      <section id="phone" aria-label="Recovered phone">
        <div id="status">
          <span id="clock">ARCHIVE</span><span class="device-island"></span
          ><span>▂▄▆ &nbsp; 61% ▰</span>
        </div>
        <div id="screen"></div>
        <nav id="dock" aria-label="Quick navigation">
          <button onclick="home()" aria-label="Device home">Device</button
          ><button onclick="board()">Evidence</button
          ><button onclick="caseTimeline()">Timeline</button
          ><button onclick="nbk()">Notebook</button>
        </nav>
        <button id="homebar" aria-label="Home"></button>
      </section>
      <aside id="side">
        <div class="eyebrow">
          INVESTIGATION / <span id="chapter-num">01</span>
        </div>
        <h2 id="case-title">The Last Archive</h2>
        <p id="case-goal"></p>
        <button class="text-btn" onclick="objectives()">
          View objectives <span>↗</span>
        </button>
        <div class="case-stats">
          <span><b id="stat-ev">0</b>Evidence</span
          ><span><b id="stat-links">0</b>Connections</span
          ><span><b id="stat-pz">0</b>Solved</span>
        </div>
        <div class="notebook-label">
          <h3>Field notes</h3>
          <small id="save-state">Saved locally</small>
        </div>
        <textarea
          id="nb"
          aria-label="Investigation notebook"
          placeholder="What doesn't add up?&#10;&#10;Record observations, questions and theories. Your notes save as you type."
        ></textarea
        ><button id="reset" class="text-btn">Restart investigation</button>
      </aside>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="chapter-dialog"></dialog>
    <script src="edition.js"></script>
    <script src="engine.js"></script>
    <script src="game.js"></script>
    <script src="experience.js"></script>
    <script src="art-direction.js"></script>
    <script src="production.js"></script>
    <script src="audio_director.js"></script>
    <script src="edition_ui.js"></script>
  </body>
</html>
